# ============================================================
# bothostgtagame — GitHub Actions: публикация Docker-образа
# Запускается на push в main (после тега v*) или вручную.
# Образ готов к деплою на Tatnet / Onreza / Layer0.
# ============================================================
name: Docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_NAME: bothostgtagame

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
